<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Steve's Lab</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-decoration" aria-hidden="true"></div>

  <header class="topbar">
    <div class="topbar-title">
      <img src="logo.png" alt="" class="topbar-logo" />
      <h1>Homelab</h1>
    </div>
    <div class="topbar-actions">
      <button id="add-category-btn" class="btn btn-secondary">+ Category</button>
      <button id="add-link-btn" class="btn btn-primary">+ Link</button>
    </div>
  </header>

  <main id="board" class="board"></main>

  <p id="empty-state" class="empty-state" hidden>
    No links yet. Add a category, then add your first link.
  </p>

  <!-- Link modal -->
  <div id="link-modal" class="modal-overlay" hidden>
    <form id="link-form" class="modal">
      <h2 id="link-modal-title">Add link</h2>
      <input type="hidden" id="link-id" />

      <label>
        Name
        <input type="text" id="link-name" required maxlength="80" placeholder="Plex" />
      </label>

      <label>
        URL
        <input type="url" id="link-url" required placeholder="http://192.168.1.10:32400" />
      </label>

      <label>
        Description
        <input type="text" id="link-description" maxlength="200" placeholder="Media server" />
      </label>

      <label>
        Category
        <select id="link-category"></select>
      </label>

      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" data-close="link-modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>

  <!-- Category modal -->
  <div id="category-modal" class="modal-overlay" hidden>
    <form id="category-form" class="modal">
      <h2>Add category</h2>
      <label>
        Name
        <input type="text" id="category-name" required maxlength="60" placeholder="Media" />
      </label>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" data-close="category-modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>

  <!-- Confirm modal -->
  <div id="confirm-modal" class="modal-overlay" hidden>
    <div class="modal">
      <h2 id="confirm-modal-title">Delete?</h2>
      <p id="confirm-modal-message" class="confirm-message"></p>
      <div class="modal-actions">
        <button type="button" id="confirm-cancel-btn" class="btn btn-secondary">Cancel</button>
        <button type="button" id="confirm-ok-btn" class="btn btn-danger">Delete</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
